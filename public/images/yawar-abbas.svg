<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D2E"/>
      <stop offset="50%" stop-color="#165B45"/>
      <stop offset="100%" stop-color="#08241B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DBF73"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Texture -->
  <g opacity="0.08" stroke="#1DBF73" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- Glowing Orb -->
  <circle cx="400" cy="350" r="180" fill="#1DBF73" opacity="0.15" filter="url(#glow)"/>

  <!-- Stylized Editorial Silhouette -->
  <!-- Head & Hair -->
  <path d="M 330, 270 Q 400, 210 470, 270 Q 485, 340 470, 390 Q 400, 435 330, 390 Q 315, 340 330, 270 Z" fill="#08241B" stroke="#1DBF73" stroke-width="2"/>
  
  <!-- Face Contour -->
  <path d="M 345, 300 Q 400, 290 455, 300 Q 460, 360 400, 420 Q 340, 360 345, 300 Z" fill="#165B45" opacity="0.4"/>

  <!-- Shoulders & Blazer -->
  <path d="M 210, 680 Q 250, 490 350, 450 L 400, 520 L 450, 450 Q 550, 490 590, 680 L 800, 1000 L 0, 1000 Z" fill="#071F18" stroke="#1DBF73" stroke-width="2" opacity="0.9"/>
  
  <!-- Lapel / Shirt details -->
  <path d="M 350, 450 L 400, 600 L 450, 450" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
  <path d="M 380, 520 L 400, 700 L 420, 520" fill="#ffffff" opacity="0.9"/>

  <!-- Badge Label overlay -->
  <rect x="250" y="820" width="300" height="60" rx="12" fill="#0F3D2E" stroke="#1DBF73" stroke-width="2"/>
  <text x="400" y="857" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Yawar Abbas</text>
  <text x="400" y="872" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1DBF73" text-anchor="middle" letter-spacing="3">SEO SPECIALIST</text>
</svg>
